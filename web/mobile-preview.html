<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SocketAI 模型预览</title>
    <style>
      :root {
        --bg: #f5f4ef;
        --ink: #1d2528;
        --muted: #687174;
        --line: #dde1df;
        --accent: #1f7a68;
        --warn: #d96d3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(160deg, #eef5f2 0%, #f5f4ef 45%, #edf2f8 100%);
        color: var(--ink);
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      #viewer {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .overlay {
        position: absolute;
        left: 12px;
        right: 12px;
        pointer-events: none;
      }
      .overlay-top {
        top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .badge {
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        backdrop-filter: blur(8px);
      }
      .badge strong {
        color: var(--accent);
        font-weight: 700;
      }
      .hint {
        bottom: 10px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.45;
        color: #344244;
      }
      .hint em {
        color: var(--warn);
        font-style: normal;
        font-weight: 700;
      }
      .state {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        background: rgba(245, 244, 239, 0.72);
      }
      .state.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <div id="state" class="state">加载模型中…</div>
    <div id="viewer" hidden></div>
    <div class="overlay overlay-top">
      <div class="badge">单指拖动 · 旋转预览</div>
      <div id="legend" class="badge"><strong>残肢</strong> + 接受腔</div>
    </div>
    <div id="hint" class="overlay hint" hidden>拖动旋转，对照模型选择疼痛区域</div>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./mobile-preview.js"></script>
  </body>
</html>
