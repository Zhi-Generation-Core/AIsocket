# Nginx 片段：挂载到 mugzju.top 主站 server 块内
# 静态目录：/var/www/socketai/
# 后端 PM2：socketai-api，默认端口 3010

location /socketai/api/ {
    proxy_pass http://127.0.0.1:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 80m;
}

location /socketai/ {
    alias /var/www/socketai/;
    try_files $uri $uri/ /socketai/index.html;
}
